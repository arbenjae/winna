<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Cash Cascade</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --bg-dark: #0a0a1a;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .slot-machine {
            background: #111;
            border: 4px solid var(--neon-pink);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px var(--neon-pink);
            text-align: center;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }
        .reels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
        }
        .reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .symbol {
            font-size: 3rem;
            background: #222;
            height: 80px;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid #444;
            box-shadow: inset 0 0 10px #000;
        }
        .spin-btn {
            margin-top: 25px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--neon-pink);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .spin-btn:active {
            transform: scale(0.95);
        }
        .spin-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
        .message-board {
            margin-top: 15px;
            height: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }
        .blur {
            filter: blur(4px);
            animation: shake 0.1s infinite;
        }
        @keyframes shake {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(5px); }
        }
    </style>
</head>
<body>

    <h1>✨ Cosmic Cash Cascade ✨</h1>
    
    <div class="slot-machine">
        <div class="stats">
            <div>Credits: $<span id="credits">1000</span></div>
            <div>Bet: $10</div>
            <div>Free Spins: <span id="free-spins">0</span></div>
        </div>

        <div class="reels-container" id="reels">
            <!-- Reels generated by JS -->
        </div>

        <div class="message-board" id="message">Press Spin to Start!</div>
        
        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
    </div>

    <script>
        // Game Configuration & Math Model
        const SYMBOLS = [
            { icon: '🍒', weight: 40, value: 5 },     // Low tier
            { icon: '🍋', weight: 30, value: 10 },    // Low tier
            { icon: '🍇', weight: 15, value: 25 },    // Mid tier
            { icon: '💎', weight: 8, value: 100 },    // High tier
            { icon: '🚀', weight: 4, value: 500 },    // Wild/Top tier
            { icon: '🪐', weight: 3, value: 0 }       // Scatter (Triggers Bonus)
        ];
        
        const BET = 10;
        let credits = 1000;
        let freeSpins = 0;
        let isSpinning = false;
        
        // Build weighted array for random selection
        let reelTape = [];
        SYMBOLS.forEach(sym => {
            for(let i=0; i<sym.weight; i++) reelTape.push(sym.icon);
        });

        // Initialize Grid (3x3)
        let grid = [
            ['🍒', '🍒', '🍒'],
            ['🍋', '🍋', '🍋'],
            ['🍇', '🍇', '🍇']
        ];

        const reelsEl = document.getElementById('reels');
        const creditsEl = document.getElementById('credits');
        const freeSpinsEl = document.getElementById('free-spins');
        const messageEl = document.getElementById('message');
        const spinBtn = document.getElementById('spin-btn');

        function renderGrid(applyBlur = false) {
            reelsEl.innerHTML = '';
            for (let col = 0; col < 3; col++) {
                const reelDiv = document.createElement('div');
                reelDiv.className = 'reel';
                for (let row = 0; row < 3; row++) {
                    const symDiv = document.createElement('div');
                    symDiv.className = `symbol ${applyBlur ? 'blur' : ''}`;
                    symDiv.innerText = grid[row][col];
                    reelDiv.appendChild(symDiv);
                }
                reelsEl.appendChild(reelDiv);
            }
        }

        function getRandomSymbol() {
            return reelTape[Math.floor(Math.random() * reelTape.length)];
        }

        function spin() {
            if (isSpinning || (credits < BET && freeSpins === 0)) {
                if (credits < BET && freeSpins === 0) messageEl.innerText = "OUT OF CREDITS!";
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            messageEl.innerText = "Spinning...";

            if (freeSpins > 0) {
                freeSpins--;
                freeSpinsEl.innerText = freeSpins;
            } else {
                credits -= BET;
                creditsEl.innerText = credits;
            }

            // Fake spin animation loop
            let spinTicks = 0;
            const maxTicks = 20; 
            const spinInterval = setInterval(() => {
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        grid[r][c] = getRandomSymbol();
                    }
                }
                renderGrid(true);
                spinTicks++;

                if (spinTicks >= maxTicks) {
                    clearInterval(spinInterval);
                    finishSpin();
                }
            }, 50);
        }

        function finishSpin() {
            renderGrid(false);
            evaluateWin();
            isSpinning = false;
            if (freeSpins === 0) spinBtn.disabled = false;
            else setTimeout(spin, 1000); // Auto-spin during free spins
        }

        function evaluateWin() {
            let totalWin = 0;
            let scatterCount = 0;
            let multiplier = freeSpins > 0 ? 5 : 1; // 5x Multiplier during Free Spins

            // Check 3 horizontal paylines
            for (let row = 0; row < 3; row++) {
                let s1 = grid[row][0];
                let s
